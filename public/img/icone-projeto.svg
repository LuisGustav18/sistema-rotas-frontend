<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fundo base do mapa (quadrado com bordas arredondadas) -->
  <rect x="5" y="5" width="90" height="90" rx="16" fill="#E8F5E9" />

  <!-- Ruas principais (linhas brancas grossas simulando o Google Maps) -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <line x1="5" y1="40" x2="95" y2="30" stroke-width="6" />
    <line x1="5" y1="65" x2="95" y2="75" stroke-width="6" />
    <line x1="35" y1="5" x2="45" y2="95" stroke-width="8" />
    <line x1="75" y1="5" x2="65" y2="95" stroke-width="6" />
  </g>

  <!-- Áreas verdes simulando parques e quarteirões no mapa -->
  <rect x="12" y="12" width="18" height="22" rx="4" fill="#C8E6C9" />
  <rect x="52" y="12" width="18" height="15" rx="4" fill="#C8E6C9" />
  <rect x="12" y="72" width="28" height="15" rx="4" fill="#C8E6C9" />
  <rect x="72" y="40" width="15" height="30" rx="4" fill="#A5D6A7" />

  <!-- Sombra do Marcador para dar profundidade -->
  <ellipse cx="50" cy="55" rx="8" ry="3" fill="rgba(0, 50, 0, 0.15)" />

  <!-- Marcador (Pin) focado no centro (verde mais escuro para destaque) -->
  <path d="M 50 55 C 50 55 34 35 34 22 A 16 16 0 1 1 66 22 C 66 35 50 55 50 55 Z" fill="#2E7D32" />

  <!-- Detalhe interno do Marcador (bolinha branca) -->
  <circle cx="50" cy="22" r="6" fill="#FFFFFF" />
  <circle cx="50" cy="22" r="2" fill="#2E7D32" />
</svg>
